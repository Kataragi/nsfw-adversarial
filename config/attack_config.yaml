# Adversarial Attack Configuration (image-based)

# Pipeline settings
pipeline:
  classifier_path: "models/target_classifier/pnsfwmedia_classifier.keras"
  projection_path: "models/nudenet_projection.npy"
  backbone_cache_dir: "models/tf_backbone"
  image_size: 320
  threshold: 0.5

# Image settings
images:
  dir: "dataset/nsfw_images"
  extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]

# Attack methods (epsilon in pixel-scale [0,1]; 8/255 ≈ 0.031)
attacks:
  fgsm:
    epsilon: [0.0157, 0.0314, 0.0627, 0.1255]  # 4, 8, 16, 32 /255
    targeted: true
    target_label: 0.0

  pgd:
    epsilon: [0.0157, 0.0314, 0.0627, 0.1255]
    alpha_ratio: 0.25    # alpha = epsilon * alpha_ratio
    iterations: [10, 20, 40]
    random_start: true
    targeted: true
    target_label: 0.0

  cw:
    c: [0.01, 0.1, 1.0, 10.0]
    kappa: [0.0, 5.0, 10.0]
    iterations: [200, 500, 1000]
    learning_rate: 0.01
    binary_search_steps: 9

  deepfool:
    max_iterations: [50, 100, 200]
    overshoot: [0.02, 0.05, 0.1]

# Evaluation settings
evaluation:
  thresholds: [0.3, 0.4, 0.5]
  batch_size: 8
  seed: 42

# Output settings
output:
  results_dir: "experiments/attack_results"
  visualizations_dir: "experiments/visualizations"
  save_adversarial_images: true
  save_noise_images: false

# TensorBoard settings
tensorboard:
  log_dir: "logs"
  enabled: true

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
