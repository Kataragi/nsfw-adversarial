# Adversarial Attack Configuration

# Target classifier settings
target_model:
  path: "models/target_classifier/pnsfwmedia_classifier.keras"
  input_dim: 256
  threshold: 0.5

# Embedding settings
embeddings:
  dir: "dataset/nsfw_embeddings"
  dim: 256

# Attack methods
attacks:
  fgsm:
    epsilon: [0.01, 0.03, 0.05, 0.07, 0.1]
    targeted: true
    target_label: 0.0

  pgd:
    epsilon: [0.01, 0.03, 0.05, 0.07, 0.1]
    alpha: [0.001, 0.005, 0.01]
    iterations: [10, 20, 40]
    random_start: true
    targeted: true
    target_label: 0.0

  cw:
    c: [0.01, 0.1, 1.0, 10.0]
    kappa: [0.0, 5.0, 10.0]
    iterations: [200, 500, 1000]
    learning_rate: 0.01
    binary_search_steps: 9

  deepfool:
    max_iterations: [50, 100, 200]
    overshoot: [0.02, 0.05, 0.1]

# Evaluation settings
evaluation:
  thresholds: [0.3, 0.4, 0.5]
  batch_size: 256
  seed: 42

# Output settings
output:
  results_dir: "experiments/attack_results"
  visualizations_dir: "experiments/visualizations"
  save_adversarial_embeddings: true
  save_noise: true

# TensorBoard settings
tensorboard:
  log_dir: "logs"
  enabled: true

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
